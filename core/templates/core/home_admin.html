<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin — Portal IPF</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Exo+2:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    /* ── Variables y estructura base intactas ── */
    :root {
      --bg-deep:     #04080f;
      --bg-card:     #0b1120;
      --bg-panel:    #0f1a2e;
      --border:      rgba(0,180,255,0.18);
      --border-glow: rgba(0,180,255,0.55);
      --accent:      #00b4ff;
      --accent2:     #0066cc;
      --accent3:     #00e5ff;
      --text-main:   #e8f4fc;
      --text-muted:  #7a9ab8;
      --danger:      #ff4757;
      --success:     #2ed573;
      --admin-badge: #ffb142; /* Color especial sutil para el rol admin */
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--bg-deep);
      font-family: 'Exo 2', sans-serif;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,180,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,180,255,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      animation: gridDrift 20s linear infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes gridDrift {
      0%   { transform: translateY(0); }
      100% { transform: translateY(40px); }
    }

    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.18;
      pointer-events: none;
      z-index: 0;
      animation: blobPulse 6s ease-in-out infinite alternate;
    }
    .blob1 { width: 500px; height: 500px; top: -100px; left: -100px; background: #0055aa; }
    .blob2 { width: 400px; height: 400px; bottom: -80px; right: -80px; background: #00b4ff; animation-delay: -3s; }

    @keyframes blobPulse {
      from { opacity: 0.12; transform: scale(1); }
      to   { opacity: 0.22; transform: scale(1.1); }
    }

    .scanline {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.4;
      animation: scan 4s linear infinite;
      pointer-events: none;
      z-index: 1;
    }
    @keyframes scan {
      0%   { top: 0; }
      100% { top: 100vh; }
    }

    .card {
      position: relative;
      z-index: 2;
      width: 95%;
      max-width: 600px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.7), 0 0 80px rgba(0,100,200,0.12);
      animation: cardIn 0.7s cubic-bezier(0.22,1,0.36,1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(30px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .card::before, .card::after {
      content: '';
      position: absolute;
      width: 18px; height: 18px;
      border-color: var(--accent);
      border-style: solid;
    }
    .card::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; border-radius: 14px 0 0 0; }
    .card::after  { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; border-radius: 0 0 14px 0; }

    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin-bottom: 32px;
    }

    .logo-wrap {
      position: relative;
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-ring {
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      border: 1.5px solid transparent;
      background: linear-gradient(135deg, var(--accent), var(--accent2)) border-box;
      -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: destination-out;
      mask-composite: exclude;
      animation: rotateSlow 8s linear infinite;
    }
    @keyframes rotateSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .logo-wrap img {
      width: 70px;
      height: 70px;
      object-fit: contain;
      filter: drop-shadow(0 0 12px rgba(0,180,255,0.4));
    }

    .institution h1 {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;
      background: linear-gradient(135deg, var(--text-main) 40%, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 26px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border-glow), transparent);
    }
    .divider span {
      font-size: 0.6rem;
      letter-spacing: 3px;
      color: var(--accent);
      text-transform: uppercase;
      white-space: nowrap;
    }

    .card-footer {
      margin-top: 32px;
      text-align: center;
    }
    .card-footer p { font-size: 0.68rem; letter-spacing: 1.5px; color: var(--text-muted); text-transform: uppercase; }

    /* ── Estilos del Perfil y Grilla (Adaptados para Admin) ── */
    
    .user-profile {
      display: flex;
      align-items: center;
      gap: 18px;
      background: rgba(0, 180, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
    }

    .avatar {
      width: 50px;
      height: 50px;
      background: var(--bg-panel);
      border: 2px solid var(--admin-badge); /* Borde diferenciado para admin */
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      color: var(--admin-badge);
      font-size: 1.2rem;
      box-shadow: 0 0 15px rgba(255, 177, 66, 0.15);
    }

    .user-details h2 {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .user-details p {
      font-size: 0.75rem;
      color: var(--admin-badge); /* Badge de rol */
      letter-spacing: 1.5px;
      font-weight: 600;
      margin-top: 2px;
    }

    .nav-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); /* Celdas un poco más anchas */
      gap: 14px;
    }

    .nav-item {
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px 10px;
      transition: all 0.3s ease;
    }

    .nav-item svg {
      width: 24px;
      height: 24px;
      stroke: var(--accent);
      fill: none;
      stroke-width: 1.8;
      transition: transform 0.3s ease;
    }

    .nav-item span {
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-main);
    }

    .nav-item:hover {
      border-color: var(--accent);
      background: rgba(0, 180, 255, 0.08);
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(0, 180, 255, 0.1);
    }

    .nav-item:hover svg {
      transform: scale(1.1);
      filter: drop-shadow(0 0 5px var(--accent));
    }

    .btn-logout {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      margin-top: 26px;
      padding: 12px;
      background: rgba(255, 71, 87, 0.1);
      border: 1px solid rgba(255, 71, 87, 0.3);
      border-radius: 8px;
      color: var(--danger);
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-decoration: none;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .btn-logout:hover {
      background: var(--danger);
      color: #fff;
      box-shadow: 0 0 20px rgba(255, 71, 87, 0.4);
    }
  </style>
</head>
<body>

  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="scanline"></div>

  <div class="card">
    <div class="header">
      <div class="logo-wrap">
        <div class="logo-ring"></div>
        <img src="https://i.ibb.co/k2j0wb79/IPF.png" alt="IPF Logo" />
      </div>
      <div class="institution">
        <h1>Instituto Politecnico Formosa</h1>
      </div>
    </div>

    <div class="divider"><span>Panel de Administración</span></div>

    <div class="user-profile">
      <div class="avatar">
        {{ user.first_name|slice:":1"|default:"A" }}
      </div>
      <div class="user-details">
        <h2>Bienvenido, {{ user.first_name }}</h2>
        <p>ROL: ADMINISTRADOR</p>
      </div>
    </div>

    <nav class="nav-grid">
      <a href="/admin/" class="nav-item">
        <svg viewBox="0 0 24 24">
          <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
          <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
          <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
        </svg>
        <span>Admin Django</span>
      </a>
      
      <a href="#" class="nav-item">
        <svg viewBox="0 0 24 24">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
        <span>Gestión Alumnos</span>
      </a>

      <a href="#" class="nav-item">
        <svg viewBox="0 0 24 24">
          <line x1="18" y1="20" x2="18" y2="10"></line>
          <line x1="12" y1="20" x2="12" y2="4"></line>
          <line x1="6" y1="20" x2="6" y2="14"></line>
        </svg>
        <span>Estadísticas</span>
      </a>

      <a href="#" class="nav-item">
        <svg viewBox="0 0 24 24">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
        </svg>
        <span>Estado de Red</span>
      </a>
    </nav>

    <a href="{% url 'alumnos:logout' %}" class="btn-logout">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
      Cerrar Sesión
    </a>

    <div class="card-footer">
      <p>Módulo Administrativo — Acceso Restringido</p>
    </div>

  </div>

</body>
</html>
